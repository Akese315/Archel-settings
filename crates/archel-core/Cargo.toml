[package]
name = "archel-core"
version = "0.1.0"
edition.workspace = true
description = "Archel shared settings library — every system integration lives here"
license = "MIT OR Apache-2.0"

[dependencies]
thiserror = "2.0"
rust-i18n = "4.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
duct = "1.1.2"
which = "8.0.6"
directories = "6.0"
sysinfo = "0.39"
nvml-wrapper = "0.13"
# Phase 3 (PKG-01): installed-DB reads plus epoch-aware version compare.
# `checkver` fails the build loudly on a libalpm mismatch (STACK rule).
alpm = { version = "5.0.2", features = ["checkver"] }
