[package]
name = "archel-core"
version = "0.1.0"
edition.workspace = true
description = "Archel shared settings library — every system integration lives here"
license = "MIT OR Apache-2.0"

[dependencies]
thiserror = "2.0"
rust-i18n = "4.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
duct = "1.1.2"
which = "8.0.6"
directories = "6.0"
sysinfo = "0.39"
nvml-wrapper = "0.13"
# Phase 3 (PKG-01): installed-DB reads plus epoch-aware version compare.
# `checkver` fails the build loudly on a libalpm mismatch (STACK rule).
alpm = { version = "5.0.2", features = ["checkver"] }
# Phase 4 (NET-01): first async in core — tokio runtime for zbus + bluer
# (STACK rule: rt-multi-thread + time + macros, minimal surface).
# Versions verified via `cargo search` at plan time (tokio 1.53.2,
# zbus 5.19.0). rpassword 7.5.4 verified but NOT added (VPN/proxy-auth
# prompt lands in a later plan); `networkmanager` 0.5.0 stays OUT —
# SUS legitimacy verdict, human-gated spike only.
tokio = { version = "1.53.2", features = ["rt-multi-thread", "time", "macros"] }
zbus = "5.19.0"
# Phase 4 (NET-04/05): no-echo stdin prompts for proxy/VPN secrets.
# Version verified via `cargo search` at plan time (7.5.4). Secrets are
# prompted at use time only — never CLI args, never stored, never
# logged (T-4-04).
rpassword = "7.5"
