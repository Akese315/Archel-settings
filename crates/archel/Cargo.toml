[package]
name = "archel"
version = "0.1.0"
edition.workspace = true
description = "Archel system settings — single binary: CLI subcommands plus the graphical interface"
license = "MIT OR Apache-2.0"

[[bin]]
name = "archel"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:cxx-qt", "dep:cxx-qt-lib"]

[dependencies]
archel-core = { path = "../archel-core" }
clap = { version = "4.6", features = ["derive"] }
cxx-qt = { version = "=0.10.0", optional = true }
cxx-qt-lib = { version = "=0.10.0", optional = true }
