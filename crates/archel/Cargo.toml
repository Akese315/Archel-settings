[package]
name = "archel"
version = "0.1.0"
edition.workspace = true
description = "Archel system settings — single binary: CLI subcommands plus the graphical interface"
license = "MIT OR Apache-2.0"

[[bin]]
name = "archel"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:cxx", "dep:cxx-qt", "dep:cxx-qt-lib", "dep:cxx-qt-build", "dep:qt-build-utils"]

[dependencies]
archel-core = { path = "../archel-core" }
clap = { version = "4.6", features = ["derive"] }
# `derive`: Geometry/ScreenRect serde structs (06-01, D-23).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# XDG config dir for window-geometry.json (06-01), same ProjectDirs call
# as archel-core's updates cache.
directories = "6"
# Phase 4 (NET-01): single async runtime for the binary — core exposes
# `async fn`s (zbus D-Bus paths), the binary owns the only runtime.
# `net`: abstract-namespace UnixListener for the single-instance claim
# (06-01, D-26). Non-optional so the gui module's I/O type is always live.
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net"] }
cxx = { version = "1", optional = true }
cxx-qt = { version = "=0.10.0", optional = true }
cxx-qt-lib = { version = "=0.10.0", optional = true, features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
clap_complete = "4.6.11"

[dev-dependencies]
# First snapshot use (02-03): pins every --json schema so later phases
# cannot silently reshape machine output. Version re-verified at plan
# time via `cargo search` (1.48.0, matches the STACK.md pin).
insta = { version = "1.48", features = ["json"] }

[build-dependencies]
cxx-qt-build = { version = "=0.10.0", optional = true, features = ["link_qt_object_files"] }
# Direct access to QResourceFile for vendored SVG registration (cxx-qt-build
# only re-exports QResource/QResources). Pin matches cxx-qt-build's own dep.
qt-build-utils = { version = "=0.10.0", optional = true }
